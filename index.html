<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NASEC BD Fees &amp; Contract Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: black ERP sidebar + working area; a flow bar walks the six screens in order. Deliberately single light theme, faithful to the NASEC ERP design. */
:root{
  color-scheme:light;
  --ink:#1B2230; --ink-2:#3A4250; --muted:#5E6573; --faint:#9AA3B0;
  --bg:#F7F8FA; --surface:#FFFFFF; --line:#DEE2E8; --line-2:#EEF0F3; --chip:#EEF0F3;
  --black:#000000; --side-hover:#1A212C; --side-active:#262F3D; --side-text:#DCE0E6;
  --amber:#F2B633; --amber-ink:#3D2A06; --amber-soft:#FEF6E4; --amber-softer:#FFFBF0; --amber-line:#F7D98C; --amber-text:#9A5B05; --amber-deep:#6B3F03;
  --green:#047857; --green-soft:#ECFDF5; --red:#B91C1C; --red-soft:#FEF2F2; --red-line:#FCA5A5; --red-deep:#7F1D1D;
  --blue:#1D4ED8; --blue-soft:#EFF4FF; --night:#0B0F16;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --serif:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
a{color:var(--amber-text)}a:hover{color:var(--amber-deep)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint);color:var(--ink)}
.btn-primary{background:var(--black);color:#FAF7EE;border-color:var(--black)}.btn-primary:hover{color:#FFFFFF;background:#1A212C}
.btn-amber{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}.btn-amber:hover{color:var(--amber-ink);background:#E8A91F}
.seg{height:36px;padding:0 14px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--muted);border-radius:6px;cursor:pointer}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.segs{display:flex;gap:2px;padding:3px;background:var(--chip);border-radius:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.td{padding:10px 12px;border-bottom:1px solid var(--line-2);font-size:14px;vertical-align:middle}
.r{text-align:right}
.tbl{width:100%;border-collapse:collapse}
.scroll{overflow-x:auto}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.col{display:flex;flex-direction:column}
.wrap{display:flex;flex-wrap:wrap}

/* shell */
.app{display:flex;min-height:100vh}
.side{flex:0 0 248px;background:var(--black);color:var(--side-text);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--amber);color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 12px;border-radius:8px;color:var(--side-text);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--side-hover);color:#FFF}
.nav a.on{background:var(--side-active);color:#FFF;box-shadow:inset 3px 0 0 var(--amber)}
.nav .sec{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.08em;padding:14px 12px 6px}
.nav .dim{opacity:.55;pointer-events:none}
.badge{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:var(--amber);color:#000;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--side-active)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#000;flex:none}

.main{flex:1 1 auto;min-width:0;padding-block:20px 48px;padding-left:max(28px, env(safe-area-inset-left, 0px));padding-right:max(28px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
.flow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.flow a{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.flow a b{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--faint)}
.flow a:hover{color:var(--ink);border-color:var(--faint)}
.flow a.on{background:var(--black);border-color:var(--black);color:#FFF}
.flow a.on b{color:var(--amber)}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.crumb{font-size:13px;color:var(--muted)}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{margin:0;font-size:15px;font-weight:700}
.sub{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--black);color:#FFF;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50;max-width:calc(100% - 32px)}

/* contract */
.art{display:flex;gap:10px;align-items:center;width:100%;min-height:36px;padding:0 10px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer}
.art:hover{background:#F2F4F7}.art.on{background:var(--amber-soft);font-weight:700}
.tab{height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--amber)}
.merge{background:#FEF0C7;color:var(--amber-deep);padding:1px 4px;border-radius:4px;font-family:var(--mono);font-size:14px}
.ptab{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}
.ptab.on{background:var(--black);color:#FAF7EE;font-weight:600}
.dot{flex:0 0 10px;height:10px;margin-top:4px;border-radius:50%}

@media (max-width:860px){
  .app{flex-direction:column}
  .side{position:static;height:auto;flex:none;padding:14px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px));gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav a{white-space:nowrap;flex:none}
  .nav .sec,.nav .dim,.me{display:none}
  .main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .mw{max-width:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="side" aria-label="NASEC ERP">
    <div class="brand"><div class="logo">N</div><div class="col"><span style="font-weight:700;font-size:15px;color:#FFF">NASEC ERP</span><span id="office" style="font-size:11px;color:var(--faint)">Dubai office · AED</span></div></div>
    <nav class="nav" aria-label="Main" id="nav"></nav>
    <div class="me"><div class="avatar">ME</div><div class="col"><span style="font-size:13px;color:#FFF;font-weight:600">Mohamed El Mezayen</span><span style="font-size:11px;color:var(--faint)">President &amp; CEO</span></div></div>
  </aside>
  <main class="main">
    <nav class="flow" aria-label="Workflow" id="flow"></nav>
    <div id="view" class="col" style="gap:18px"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const SCREENS=[
  {id:'fees',no:'01',name:'Fees builder',nav:'proposals'},
  {id:'proposals',no:'02',name:'Proposals & CRM',nav:'proposals'},
  {id:'contract',no:'03',name:'Contract builder',nav:'contracts'},
  {id:'approval',no:'04',name:'Director approval',nav:'approvals'},
  {id:'activate',no:'05',name:'Activate contract',nav:'contracts'},
  {id:'billing',no:'06',name:'Deliverables & billing',nav:'projects'}
];
const NAV=[['Dashboard'],['Projects','billing','projects'],['Tasks'],['CRM'],['sec','BUSINESS DEVELOPMENT'],['Proposals & fees','proposals','proposals'],['Contracts','contract','contracts'],['Rate cards & templates'],['sec','FINANCE'],['Billing plan'],['Invoices'],['Approvals','approval','approvals',3],['Settings']];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>Math.round(n).toLocaleString('en-US');
const num=v=>{const n=Number(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?n:0};
const view=document.getElementById('view');
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-toast]');if(b){e.preventDefault();toast(b.dataset.toast)}});

/* ---------- 01 Fees builder ---------- */
const fees={cost:60000000,gfa:6218,pct:1.05,lump:630000,rate:101.32,method:'pct',months:16,rev:'R2'};
function feesCalc(){
  const s=fees;
  let design=s.method==='pct'?s.cost*s.pct/100:s.method==='lump'?s.lump:s.gfa*s.rate;design=Math.round(design);
  const defs=[['Advance / mobilisation','S1','On signing',10,'1 · signed agreement'],['Concept design','S2 → G2','Client approval G2',10,'8 · massing, renders'],['Detailed design','S4 → G4','Submission S4',30,'7 · coordinated set'],['NOCs obtained','Authority','All NOCs approved',20,'12 · DEWA, DCD, RTA…'],['Building permit','Authority','Permit issued',10,'1 · DM permit'],['Tender','S6–S7','Bid evaluation report',10,'5 · tender package'],['IFC drawings','IFC','IFC set issued',10,'1 · IFC transmittal']];
  let acc=0;const stages=defs.map((d,i)=>{const amt=i===defs.length-1?design-acc:Math.round(design*d[3]/100);acc+=amt;return{name:d[0],erp:d[1],trigger:d[2],pct:d[3],amount:amt,deliv:d[4]}});
  const pctSum=defs.reduce((a,d)=>a+d[3],0);
  const roles=[['Resident Engineer',40000,1],['Senior Architect',30000,.25],['Senior Structural Eng.',30000,.25],['Senior MEP Engineer',30000,.25],['Civil Inspector',22500,.25],['MEP Inspector',20000,.25]];
  const supMonthly=roles.reduce((a,r)=>a+r[1]*r[2],0);
  const months=Math.max(0,Math.round(s.months));const supTotal=supMonthly*months;const total=design+supTotal;
  const hours=Math.round(s.gfa*0.5066);const cost=hours*95+months*52000;const margin=total>0?(total-cost)/total*100:0;const good=margin>=25;
  const checks=[[pctSum===100,'Design stages total '+pctSum+'%'],[months>0,months>0?'Supervision duration set ('+months+' months)':'Supervision has no number of months'],[true,'Extension rates ≥ rate card'],[true,'Monthly × months = supervision total'],[true,'No plot / client text from other proposals'],[good,good?'Margin above floor':'Margin below 25% floor: Director approval needed']];
  return{design,stages,pctSum,roles,supMonthly,months,supTotal,total,hours,cost,margin,good,checks};
}
function feesLive(){
  const c=feesCalc(),q=id=>document.getElementById(id);
  q('f-design').textContent='AED '+f(c.design);
  q('f-stages').innerHTML=c.stages.map(s=>`<tr><td class="td" style="font-weight:600">${s.name}</td><td class="td"><span class="mono" style="font-size:12px;padding:3px 8px;border-radius:6px;background:var(--chip)">${s.erp}</span></td><td class="td" style="color:var(--ink-2);font-size:13px">${s.trigger}</td><td class="td mono r">${s.pct}%</td><td class="td mono r" style="font-weight:600">${f(s.amount)}</td><td class="td" style="font-size:13px;color:var(--muted)">${s.deliv}</td></tr>`).join('')+`<tr><td class="td" style="font-weight:700" colspan="3">Total design</td><td class="td mono r" style="font-weight:700">${c.pctSum}%</td><td class="td mono r" style="font-weight:700">${f(c.design)}</td><td class="td"></td></tr>`;
  q('f-staff').innerHTML=c.roles.map(r=>`<tr><td class="td">${r[0]}</td><td class="td mono r">${f(r[1])}</td><td class="td mono r">${Math.round(r[2]*100)}%</td><td class="td mono r" style="font-weight:600">${f(r[1]*r[2])}</td></tr>`).join('')+`<tr><td class="td" style="font-weight:700" colspan="3">Monthly supervision fee × ${c.months} months</td><td class="td mono r" style="font-weight:700">${f(c.supMonthly)}</td></tr>`;
  q('f-histo').innerHTML=Array.from({length:Math.min(c.months,36)},()=>'<div style="flex:1 1 0;min-width:6px;height:56px;background:var(--amber-soft);border-radius:4px 4px 0 0;border-bottom:3px solid var(--amber)"></div>').join('');
  q('f-mlast').textContent='Month '+c.months;
  q('f-sum').innerHTML=[['Design',f(c.design)],['Supervision',f(c.supTotal)],['VAT 5%',f(c.total*.05)],['% of construction cost',fees.cost>0?(c.total/fees.cost*100).toFixed(2)+'%':'—'],['Design AED/m²',fees.gfa>0?f(c.design/fees.gfa):'—']].map(x=>`<div class="col" style="gap:2px"><span style="font-size:12px;color:var(--faint)">${x[0]}</span><span class="mono" style="font-size:16px">${x[1]}</span></div>`).join('')+`<div class="col" style="margin-left:auto;gap:2px;text-align:right"><span style="font-size:12px;color:var(--amber);font-weight:700;letter-spacing:.04em">TOTAL EX VAT</span><span class="mono" style="font-size:26px;font-weight:600">AED ${f(c.total)}</span></div>`;
  q('f-hours').textContent=f(c.hours)+' h';q('f-cost').textContent='AED '+f(c.cost);
  const col=c.good?'var(--green)':'var(--red)';
  q('f-margin').textContent=c.margin.toFixed(1)+'%';q('f-margin').style.color=col;
  q('f-bar').style.cssText='position:absolute;left:0;top:0;height:10px;border-radius:999px;background:'+col+';width:'+Math.max(0,Math.min(100,c.margin))+'%';
  const fails=c.checks.filter(x=>!x[0]).length;
  q('f-cc').textContent=fails?fails+' to fix':'All passing';q('f-cc').style.color=fails?'var(--red)':'var(--green)';
  q('f-checks').innerHTML=c.checks.map(x=>`<div style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4"><span class="dot" style="background:${x[0]?'var(--green)':'var(--red)'}"></span><span><strong>${x[0]?'Pass':'Fix'}</strong> · ${x[1]}</span></div>`).join('');
}
function feesMethod(){
  const m=fees.method;
  return m==='pct'?`<label class="col" style="gap:6px;width:160px"><span class="lbl">Design % of cost</span><input id="in-pct" class="inp mono" value="${fees.pct}" data-k="pct"></label>`
   :m==='lump'?`<label class="col" style="gap:6px;width:200px"><span class="lbl">Lump sum (AED)</span><input id="in-lump" class="inp mono" value="${f(fees.lump)}" data-k="lump"></label>`
   :`<label class="col" style="gap:6px;width:160px"><span class="lbl">AED per m² GFA</span><input id="in-rate" class="inp mono" value="${fees.rate}" data-k="rate"></label>`;
}
function renderFees(){
  const sel=(id,opts)=>`<select id="${id}" class="inp">${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;
  const fld=(lbl,html)=>`<label class="col" style="gap:6px"><span class="lbl">${lbl}</span>${html}</label>`;
  view.innerHTML=`
<header class="head"><div class="col" style="gap:6px">
 <div class="crumb"><a href="#">CRM</a> / <a href="#proposals">Proposals</a> / <span class="mono">PR/55-001</span></div>
 <div class="wrap" style="align-items:center;gap:12px"><h1>Abu Alnaga Office Building</h1><span class="chip" style="background:var(--amber-soft);color:var(--amber-text);border:1px solid var(--amber-line)">Draft · ${fees.rev}</span><span class="chip" style="background:var(--chip);color:var(--ink-2);font-weight:600">Design &amp; Supervision</span></div>
 <div class="sub">Plot 3261088 · Al Jadaf · DM · B+G+4P+14T+R · Lead owner: BD Manager · Valid until 19 Nov 2026</div>
</div>
<div class="wrap" style="gap:8px;align-items:center">
 <div class="segs" role="group" aria-label="Revision">${['R0','R1','R2'].map(r=>`<button class="seg${fees.rev===r?' on':''}" type="button" data-rev="${r}">${r}</button>`).join('')}</div>
 <button class="btn" type="button" data-toast="Comparison opens in the full ERP">Compare R1 → R2</button>
 <button class="btn" type="button" data-toast="TCP preview is generated as a PDF in the ERP">Preview TCP</button>
 <a class="btn btn-primary" href="#proposals" data-go="Submitted for Director review">Submit for review</a>
</div></header>

<div class="wrap" style="gap:20px;align-items:flex-start">
<section aria-label="Project inputs" class="col mw" style="flex:1 1 280px;max-width:340px;gap:16px;min-width:0">
 <div class="card col" style="padding:18px;gap:14px"><h2>Project</h2>
  ${fld('Client','<input id="in-client" class="inp" value="Abu Alnaga Real Estate">')}
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${fld('GFA (m²)',`<input id="in-gfa" class="inp mono" value="${f(fees.gfa)}" data-k="gfa">`)}${fld('Authority',sel('in-auth',['DM','DDA','Trakhees']))}</div>
  ${fld('Construction cost (AED)',`<input id="in-cost" class="inp mono" value="${f(fees.cost)}" data-k="cost">`)}
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${fld('Cost basis',sel('in-basis',['Estimate','Accepted tender','Actual final']))}${fld('Build (months)',`<input id="in-months" class="inp mono" value="${fees.months}" data-k="months">`)}</div>
  <label style="display:flex;align-items:center;gap:10px;font-size:13px;min-height:28px"><input id="in-adj" type="checkbox" checked style="width:18px;height:18px;accent-color:#000">Fee adjusts to actual final cost</label>
 </div>
 <div class="card col" style="padding:18px;gap:14px"><h2>Commercial</h2>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
   ${fld('VAT',sel('in-vat',['Ex VAT (5%)','Incl. VAT']))}${fld('Payment days','<input id="in-pay" class="inp mono" value="30">')}${fld('Advance %','<input id="in-adv" class="inp mono" value="10">')}${fld('Retention %','<input id="in-ret" class="inp mono" value="0">')}${fld('Validity (days)','<input id="in-val" class="inp mono" value="30">')}${fld('Discount %','<input id="in-disc" class="inp mono" value="0">')}
  </div>
 </div>
</section>

<section aria-label="Fee build-up" class="col" style="flex:999 1 520px;min-width:0;gap:16px">
 <div class="card col" style="padding:18px;gap:14px">
  <div class="wrap" style="justify-content:space-between;align-items:center;gap:12px"><h2>Design fee</h2>
   <div class="segs" role="group" aria-label="Fee method">${[['pct','% of construction cost'],['lump','Lump sum'],['rate','Rate × GFA']].map(m=>`<button class="seg${fees.method===m[0]?' on':''}" type="button" data-method="${m[0]}">${m[1]}</button>`).join('')}</div></div>
  <div class="wrap" style="gap:12px;align-items:flex-end">${feesMethod()}
   <div class="col" style="gap:4px;padding:0 0 4px 8px"><span class="lbl">Design fee</span><span id="f-design" class="mono" style="font-size:20px;font-weight:600"></span></div>
   <div class="sub" style="margin-left:auto;padding-bottom:6px">Template: <strong style="color:var(--ink)">Design &amp; Supervision v1</strong> · split with allocate (no rounding drift)</div></div>
  <div class="scroll" style="border:1px solid var(--line-2);border-radius:8px"><table class="tbl" style="min-width:760px"><thead><tr><th class="th">Stage</th><th class="th">ERP link</th><th class="th">Invoice trigger</th><th class="th r">%</th><th class="th r">Amount (AED)</th><th class="th">Deliverables</th></tr></thead><tbody id="f-stages"></tbody></table></div>
 </div>

/* ---------- router ---------- */
const RENDER={fees:renderFees,proposals:renderProposals,contract:renderContract,approval:renderApproval,activate:renderActivate,billing:renderBilling};
let cur='';
function route(){
  const id=(location.hash||'').slice(1);const s=SCREENS.find(x=>x.id===id)||SCREENS[0];
  const changed=s.id!==cur;cur=s.id;
  document.getElementById('flow').innerHTML=SCREENS.map(x=>`<a href="#${x.id}" class="${x.id===s.id?'on':''}"${x.id===s.id?' aria-current="page"':''}><b>${x.no}</b>${x.name}</a>`).join('');
  document.getElementById('nav').innerHTML=NAV.map(n=>n[0]==='sec'?`<span class="sec">${n[1]}</span>`:n[1]?`<a href="#${n[1]}" class="${n[2]===s.nav?'on':''}">${esc(n[0])}${n[3]?`<span class="badge">${n[3]}</span>`:''}</a>`:`<a href="#" class="dim" tabindex="-1" aria-disabled="true">${esc(n[0])}</a>`).join('');
  document.getElementById('office').textContent=s.id==='approval'?'Group · Director':'Dubai office · AED';
  RENDER[s.id]();
  if(changed){window.scrollTo(0,0);const a=document.querySelector('.flow a.on');a&&a.scrollIntoView({block:'nearest',inline:'nearest'})}
}
window.addEventListener('hashchange',route);
route();
})();
